<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O desejo pelo avesso — Atlas dos cartões autônomos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600&family=Urbanist:ital,wght@0,500;0,600;1,500&display=swap');

:root{
  --paper:#f1e7cd;
  --paper-light:#f8f2e4;
  --ink:#20252b;
  --steel:#617e92;
  --sage:#89906a;
  --clay:#b84c32;
  --ochre:#d7a63b;
  --line:rgba(32,37,43,.22);
  --accent:var(--ink);
  --human:#6c7078;
  --machine:#2f5fa8;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Epilogue',sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.display{font-family:'Urbanist',sans-serif;}

.masthead{
  max-width:1180px;margin:0 auto;
  padding:48px 28px 20px;
  border-bottom:1px solid var(--line);
}
.masthead-kicker{
  font-size:9px;letter-spacing:3px;opacity:.6;margin:0 0 10px;
}
.masthead h1{
  font-family:'Urbanist',sans-serif;
  font-size:clamp(28px,4.2vw,46px);
  font-weight:600;
  margin:0 0 6px;
  font-style:italic;
}
.masthead-sub{
  margin:0;font-size:13px;letter-spacing:1px;opacity:.65;
}

.atlas-nav{
  max-width:1180px;margin:0 auto;
  padding:18px 28px;
  display:flex;flex-wrap:wrap;gap:8px;
}
.atlas-nav button{
  font-family:'Epilogue',sans-serif;
  font-size:12.5px;
  letter-spacing:.3px;
  background:none;
  border:1px solid var(--line);
  border-radius:2px;
  color:var(--ink);
  padding:9px 14px;
  cursor:pointer;
  transition:background .25s,color .25s,border-color .25s;
}
.atlas-nav button:hover{border-color:var(--ink);}
.atlas-nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.atlas-nav button.is-active{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--paper-light);
}

.atlas-main{
  max-width:1180px;margin:0 auto;
  padding:8px 28px 64px;
  display:block;
}
.map-pane{
  margin-bottom:32px;
}
.map-frame{
  position:relative;
  border:1px solid var(--line);
  background:var(--paper-light);
  overflow:hidden;
}
.map-frame svg{display:block;width:100%;height:auto;}

/* Microcenas now render as real SVG inside the map itself — small speech/thought
   balloons drawn next to the illustrated element they refer to, inside the focused
   island. Nothing floats on top of the drawing as a panel anymore. */
#world{transition:transform .7s cubic-bezier(.22,.61,.36,1);}
[data-layer]{cursor:pointer;}
.mc-layer{transition:opacity .45s ease .1s;}
.mc-layer text{font-family:'Epilogue',sans-serif;}
.mc-bubble .mc-shape{fill:var(--paper-light);stroke:var(--ink);stroke-width:1.3;}
.mc-bubble.type-thought .mc-shape{fill:var(--paper-light);fill-opacity:.55;stroke-dasharray:2 3;}
.mc-bubble.type-silence .mc-shape{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:1.5 2.6;}
.mc-bubble .mc-tail{fill:var(--paper-light);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round;}
.mc-bubble.type-thought .mc-tail{display:none;}
.mc-bubble.type-silence .mc-tail{display:none;}
.mc-bubble.type-thought .mc-dot-trail circle{fill:var(--paper-light);stroke:var(--ink);stroke-width:1;stroke-dasharray:1.5 2;}
.mc-bubble.is-human .mc-shape,
.mc-bubble.is-human .mc-tail{stroke:var(--human);}
.mc-bubble.is-machine .mc-shape,
.mc-bubble.is-machine .mc-tail{stroke:var(--machine);}
.mc-bubble.is-human .mc-dot-trail circle{stroke:var(--human);}
.mc-bubble.is-machine .mc-dot-trail circle{stroke:var(--machine);}
.mc-bubble .mc-actor-dot{fill:var(--human);}
.mc-bubble.is-machine .mc-actor-dot{fill:var(--machine);}
.mc-bubble .mc-actor-label{font-size:7px;letter-spacing:1px;fill:var(--ink);opacity:.68;}
.mc-bubble .mc-text{font-size:9.5px;fill:var(--ink);}
.mc-bubble.type-silence .mc-text{fill:var(--ink);opacity:.52;font-style:italic;}
.mc-divider-label{font-size:8px;letter-spacing:1.4px;font-weight:600;fill:var(--ink);opacity:.6;}
.mc-divider-rule{stroke:var(--ink);stroke-width:.7;stroke-dasharray:1 3;opacity:.4;}

.map-caption{
  border:1px solid var(--line);border-top:none;
  background:var(--paper-light);
  padding:9px 14px 10px;
  font-size:9.5px;line-height:1.4;
}
.map-caption-scene{
  margin:0 0 7px;font-style:italic;opacity:.75;min-height:1.4em;
}
.mc-legend{
  display:flex;flex-wrap:wrap;gap:4px 10px;
  opacity:.6;
}
.mc-legend span{display:inline-flex;align-items:center;gap:4px;}
.mc-legend .sw{width:12px;height:8px;flex:none;border-radius:2px;box-sizing:border-box;}
.mc-legend .sw.human{background:var(--human);}
.mc-legend .sw.machine{background:var(--machine);}
.mc-legend .sw.speech{background:var(--paper-light);border:1.3px solid var(--ink);}
.mc-legend .sw.thought{background:var(--paper-light);border:1.3px dashed var(--ink);}
.mc-legend .sw.silence{background:transparent;border:1px dotted var(--line);}
.dialogue-pane{padding-top:6px;}
.dialogue-inner{max-width:62ch;margin:0 auto;}
.dialogue-kicker{
  display:flex;align-items:center;gap:8px;
  font-size:10px;letter-spacing:2.5px;
  color:var(--accent);
  margin:0 0 10px;
}
.dialogue-kicker::before{
  content:"";width:8px;height:8px;background:var(--accent);flex:none;
}
.dialogue-inner h2{
  font-family:'Urbanist',sans-serif;
  font-size:26px;font-weight:600;
  margin:0 0 18px;
}
.dialogue-inner p{
  font-size:15.5px;line-height:1.68;
  margin:0 0 16px;
}
.dialogue-inner sup{font-size:10px;opacity:.75;}

.notes{
  margin-top:28px;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.notes-label{
  display:block;font-size:9px;letter-spacing:2.5px;opacity:.55;margin-bottom:8px;
}
.notes ol{
  margin:0;padding-left:0;
  list-style:none;
}
.notes li{
  font-size:12px;line-height:1.55;opacity:.75;margin-bottom:6px;
}
.notes a{color:var(--accent);}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}
.dialogue-inner.fade-in{animation:fadeIn .45s ease;}

@media (prefers-reduced-motion:reduce){
  #world{transition:none;}
  .dialogue-inner.fade-in{animation:none;}
}
</style>

const SVG_NS = 'http://www.w3.org/2000/svg';

/* ---------- SVG text measuring + wrapping ---------------------------------
   Real balloons drawn as SVG (no foreignObject, no HTML panel). A hidden
   <text> node measures each candidate line with getComputedTextLength(),
   words are packed against a max width, and only then do we know how many
   lines there are — so the rect/tail is sized exactly to the text, never
   guessed by hand and never overflowed. Runs fresh every render. */
const measurer = document.createElementNS(SVG_NS,'text');
measurer.setAttribute('font-size','9.5');
measurer.style.fontFamily = "'Epilogue',sans-serif";
measurer.style.visibility = 'hidden';
atlasSvg.appendChild(measurer);

function textWidth(str, fontSize, opts){
  measurer.setAttribute('font-size', fontSize);
  measurer.style.letterSpacing = (opts && opts.letterSpacing) || 'normal';
  measurer.style.fontWeight = (opts && opts.fontWeight) || 'normal';
  measurer.textContent = str;
  return measurer.getComputedTextLength();
}

function wrapWords(str, maxWidth, fontSize, opts){
  const words = str.split(/\s+/).filter(Boolean);
  const lines = [];
  let current = '';
  words.forEach(w=>{
    const test = current ? current + ' ' + w : w;
    if(current && textWidth(test, fontSize, opts) > maxWidth){
      lines.push(current);
      current = w;
    }else{
      current = test;
    }
  });
  if(current) lines.push(current);
  return lines;
}

/* ---------- balloon geometry ------------------------------------------- */
const MC_FONT = 9.5, MC_LINE_H = 12, MC_MAXW = 132, MC_PAD_X = 9, MC_PAD_TOP = 8, MC_PAD_BOT = 8, MC_GAP = 15;

function el(tag, attrs){
  const n = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function bubbleGeometry(turn, extraGap){
  const gap = MC_GAP + (extraGap||0);
  const lines = wrapWords(turn.text, MC_MAXW, MC_FONT);
  const widest = Math.max(...lines.map(l=>textWidth(l, MC_FONT)));
  const boxW = Math.min(MC_MAXW, widest) + MC_PAD_X*2;
  const headerH = turn.actor ? 12 : 2;
  const boxH = headerH + lines.length*MC_LINE_H + MC_PAD_TOP + MC_PAD_BOT - (turn.actor?0:4);
  const {x:ax, y:ay} = turn.pos;
  const dir = turn.dir || {dx:0,dy:-1};
  const bx = dir.dx < 0 ? ax - gap - boxW : (dir.dx > 0 ? ax + gap : ax - boxW/2);
  const by = dir.dy < 0 ? ay - gap - boxH : (dir.dy > 0 ? ay + gap : ay - boxH/2);
  return {lines, boxW, boxH, bx, by, ax, ay, dir};
}

/* extraGap: distância extra empurrando o balão pra longe do âncora, usada pra
   resolver sobreposições entre balões vizinhos (ver resolveSceneLayout). */
function buildBubble(turn, extraGap){
  const {lines, boxW, boxH, bx, by, ax, ay, dir} = bubbleGeometry(turn, extraGap);

  const g = el('g', {class:`mc-bubble is-${turn.who||'human'} type-${turn.type}`});

  // tail: small triangle from the box edge nearest the anchor, to the anchor point
  if(turn.type === 'speech'){
    const tailBaseX = dir.dx < 0 ? bx + boxW - Math.min(22, boxW*0.35) : bx + Math.min(22, boxW*0.35);
    const tailBaseY = dir.dy < 0 ? by + boxH : by;
    const tailTipY  = dir.dy < 0 ? by + boxH + 9 : by - 9;
    const tail = el('path', {
      class:'mc-tail',
      d:`M${tailBaseX-6},${tailBaseY} L${ax},${dir.dy<0?Math.min(ay,tailTipY+6):Math.max(ay,tailTipY-6)} L${tailBaseX+7},${tailBaseY} Z`
    });
    g.appendChild(tail);
  }

  const rect = el('rect', {
    class:'mc-shape', x:bx, y:by, width:boxW, height:boxH,
    rx: turn.type==='speech' ? 9 : 11
  });
  g.appendChild(rect);

  // thin connector for thought / silence turns (no bold tail — a trailing hint)
  if(turn.type !== 'speech'){
    const nearX = dir.dx < 0 ? bx + boxW : (dir.dx > 0 ? bx : bx + boxW/2);
    const nearY = dir.dy < 0 ? by + boxH : (dir.dy > 0 ? by : by + boxH/2);
    const trail = el('g', {class:'mc-dot-trail'});
    const steps = 3;
    for(let i=1;i<=steps;i++){
      const t = i/(steps+1);
      trail.appendChild(el('circle', {
        cx: nearX + (ax-nearX)*t, cy: nearY + (ay-nearY)*t, r: 2.6 - i*0.5
      }));
    }
    g.appendChild(trail);
  }

  let ty = by + MC_PAD_TOP;
  if(turn.actor){
    g.appendChild(el('circle', {class:'mc-actor-dot', cx:bx+MC_PAD_X+2, cy:by+8.5, r:2.4}));
    const actorText = el('text', {class:'mc-actor-label', x:bx+MC_PAD_X+8, y:by+11});
    actorText.textContent = turn.actor.toUpperCase();
    g.appendChild(actorText);
    ty += 9;
  }else{
    ty -= 3;
  }

  const textEl = el('text', {class:'mc-text', x:bx+MC_PAD_X});
  lines.forEach((line,i)=>{
    const tspan = el('tspan', {x:bx+MC_PAD_X, y: ty + i*MC_LINE_H + MC_FONT*0.82});
    tspan.textContent = line;
    textEl.appendChild(tspan);
  });
  g.appendChild(textEl);

  return g;
}

/* Espelha o CSS de .mc-divider-label (negrito + letter-spacing), pra medir
   a largura do texto do jeito que ele realmente vai ser desenhado. */
const DIVIDER_TEXT_OPTS = {letterSpacing:'1.4px', fontWeight:'600'};

function buildDivider(turn){
  const lines = wrapWords(turn.text, turn.maxWidth || 150, 8, DIVIDER_TEXT_OPTS);
  const g = el('g', {class:'mc-divider'});
  lines.forEach((line,i)=>{
    const t = el('text', {class:'mc-divider-label', x:turn.pos.x, y:turn.pos.y + i*10, 'text-anchor':turn.align || 'middle'});
    t.textContent = line;
    g.appendChild(t);
  });
  return g;
}

/* ---------- anti-sobreposição -------------------------------------------
   Empurra balões que colidiriam com outro balão, com o divisor de cena
   (label) ou com o marcador numerado / título da própria ilha, para que o
   texto de um nunca cubra o de outro. Só afasta ao longo da direção que o
   próprio balão já usava (dir), então a composição original é preservada;
   ela só ganha mais espaço quando dois textos ficariam colados. */
function dividerRect(turn){
  const lines = wrapWords(turn.text, turn.maxWidth || 150, 8, DIVIDER_TEXT_OPTS);
  const widest = lines.length ? Math.max(...lines.map(l=>textWidth(l, 8, DIVIDER_TEXT_OPTS))) : 0;
  const w = widest + 6;
  const align = turn.align || 'middle';
  const x = align === 'end' ? turn.pos.x - w : (align === 'start' ? turn.pos.x : turn.pos.x - w/2);
  const h = lines.length*10 + 4;
  return {x, y: turn.pos.y - 8, w, h};
}

  erro:   [{x:1024,y:474,w:32,h:32},{x:858,y:710,w:195,h:26}, {x:858,y:736,w:235,h:14}]
};

function rectsOverlap(a, b, margin){
  margin = margin || 0;
  return !(a.x + a.w + margin < b.x || b.x + b.w + margin < a.x ||
           a.y + a.h + margin < b.y || b.y + b.h + margin < a.y);
}

function resolveSceneLayout(key, scene){
  const bubbleIdxs = [];
  scene.forEach((t,i)=>{ if(t.type !== 'label') bubbleIdxs.push(i); });
  const extra = {};
  bubbleIdxs.forEach(i=>{ extra[i] = 0; });

  const fixed = (SCENE_OBSTACLES[key] || []).slice();
  scene.forEach(t=>{ if(t.type === 'label') fixed.push(dividerRect(t)); });

  const STEP = 6, MAX_ITER = 60;
  for(let iter=0; iter<MAX_ITER; iter++){
    const rects = {};
    bubbleIdxs.forEach(i=>{
      const g = bubbleGeometry(scene[i], extra[i]);
      rects[i] = {x:g.bx, y:g.by, w:g.boxW, h:g.boxH};
    });
    let moved = false;
    bubbleIdxs.forEach(i=>{
      fixed.forEach(fr=>{
        if(rectsOverlap(rects[i], fr, 3)){ extra[i] += STEP; moved = true; }
      });
    });
    for(let a=0; a<bubbleIdxs.length; a++){
      for(let b=a+1; b<bubbleIdxs.length; b++){
        const i = bubbleIdxs[a], j = bubbleIdxs[b];
        if(rectsOverlap(rects[i], rects[j], 3)){ extra[j] += STEP; moved = true; }
      }
    }
    if(!moved) break;
  }
  return extra;
}

/* Build every island's balloons once, into its <g class="mc-layer"> — so
   switching islands just toggles opacity, no rebuilding mid-interaction. */
function buildAllMicrocenas(){
  document.querySelectorAll('.mc-layer').forEach(layer=>{
    while(layer.firstChild) layer.removeChild(layer.firstChild);
    const key = layer.dataset.scene;
    const scene = SECTIONS[key] && SECTIONS[key].scene;
    if(!scene) return;
    const extra = resolveSceneLayout(key, scene);
    scene.forEach((turn,i)=>{
      layer.appendChild(turn.type === 'label' ? buildDivider(turn) : buildBubble(turn, extra[i]));
    });
  });
}

/* ---------- text column + caption strip --------------------------------- */
function renderSection(key){
  const s = SECTIONS[key];
  document.documentElement.style.setProperty('--accent', s.accent);
  const notesHtml = s.notes.length ? `<div class="notes"><span class="notes-label">NOTAS</span><ol class="notes-list">${
    s.notes.map(n=>{
      const note = NOTES[n];
      const link = note.url ? ` <a href="${note.url}" target="_blank" rel="noopener">↗</a>` : '';
      return `<li>${n}. ${note.text}${link}</li>`;
    }).join('')
  }</ol></div>` : '';

  dialogue.innerHTML = `<p class="dialogue-kicker">${s.kicker}</p><h2>${s.title}</h2>${
    s.paragraphs.map(p=>`<p>${p}</p>`).join('')
  }${notesHtml}`;

  dialogue.classList.remove('fade-in');
  void dialogue.offsetWidth;
  dialogue.classList.add('fade-in');

  mapCaptionScene.textContent = (key !== 'overview' && s.scene && s.scene.length)
    ? 'Cena hipotética — como esse trecho pode acontecer na prática, em diálogo entre os atores da rede, desenhada dentro da própria ilha ao lado.'
    : 'Clique numa ilha para focar nela e revelar sua microcena.';
}

function setActive(key){
  layers.forEach(g=>{
    const layerKey = g.getAttribute('data-layer');
    g.style.opacity = (key === 'overview' || layerKey === key) ? '1' : '.22';
  });

  if(key === 'overview'){
    world.style.transform = 'translate(0px,0px) scale(1)';
  }else{
    const c = CENTERS[key];
    const scale = 1.65;
    const tx = 600 - c.cx * scale;
    const ty = 410 - c.cy * scale;
    world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  }

  navButtons.forEach(b=>b.classList.toggle('is-active', b.dataset.target === key));
  document.querySelectorAll('.mc-layer').forEach(el=>{
    const visible = key === el.dataset.scene;
    el.style.opacity = visible ? '1' : '0';
    el.style.pointerEvents = visible ? 'auto' : 'none';
  });
  renderSection(key);
}

navButtons.forEach(b=>b.addEventListener('click', ()=>setActive(b.dataset.target)));
layers.forEach(g=>g.addEventListener('click', ()=>setActive(g.getAttribute('data-layer'))));

buildAllMicrocenas();
setActive('overview');
// Google Fonts loads async; once it's actually in, remeasure and rebuild so
// balloon sizes match the real glyph widths, not the fallback font's.
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(buildAllMicrocenas);
}
</script>
